name: Portable protocol and runtime regressions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-native:
    name: Windows native plugin and portable checks
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build pinned SDK plugin and run portable/native tests
        shell: pwsh
        run: ./scripts/build-reference.ps1 -NativePlugin
      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-native-ctest
          path: build/portable-windows/Testing/Temporary/
          if-no-files-found: warn

  linux-portable:
    name: Linux portable protocol and relay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build and test deployed protocol units
        run: bash scripts/build-reference.sh
      - name: Preserve CTest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-portable-ctest
          path: build/portable-linux/Testing/Temporary/
          if-no-files-found: warn

  linux-sanitizers:
    name: Linux ASan and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COOP_SANITIZE: 'ON'
      COOP_BUILD_TYPE: Debug
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Instrument and test the same protocol sources
        run: bash scripts/build-reference.sh build/sanitizers
      - name: Preserve sanitizer and CTest diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-sanitizer-ctest
          path: build/sanitizers/Testing/Temporary/
          if-no-files-found: warn

  windows-runtime:
    name: Windows LuaJIT runtime regressions (no game assets)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Verify imported foundation and preserved reference sources
        run: python scripts/verify-foundation.py
      - name: Load LuaJIT and run all mock, relay and tool checks
        shell: pwsh
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: ./tests/run_all.ps1 -SkipRedscript -KeepWorkDir
      - name: Preserve runtime test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-logs
          path: ${{ runner.temp }}/cp2077coop_tests_*/**
          if-no-files-found: warn
